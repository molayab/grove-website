name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Also started by redeploy-on-release.yml when the app publishes a release here
  # (with release_tag set), and by hand from the Actions tab.
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to wait for before reading release info (optional)
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Refresh public/download.json from the latest release (waiting for release_tag's
      # DMG when given); if the API is unreachable the committed copy is used.
      - name: Sync release info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/sync-release-info.mjs || echo "::warning::Using committed download.json"

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

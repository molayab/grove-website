name: Build check

# deploy.yml only runs on main, so without this a broken install (e.g. the
# design-template-kit dependency) or a build error would first show up after merging.
on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

name: Sync blog posts

# Rewrites the "From the blog" list on index.html and es/index.html from
# https://molayab.com/feed.xml (the three newest posts tagged `grove`).
#
# Follow-up, deliberately not done here: the blog repo could fire a
# `repository_dispatch` at this repo when a post is published, so the list
# updates within minutes instead of on the next daily run. That needs a token
# secret with access to this repo stored on the blog side, plus a
# `repository_dispatch` trigger below.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-blog-posts
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate the blog post list
        run: node scripts/sync-blog-posts.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html es/index.html
          if git diff --cached --quiet; then
            echo "Blog post list already up to date"
          else
            git commit -m "chore: sync blog posts from molayab.com"
            git push origin main
          fi
